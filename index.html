<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Macro Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // ============================================================
      // MacroMonitor design tokens — two-track system.
      // Track 1 (brand/structural): navy, gold, warm paper neutrals.
      // Track 2 (semantic/data): good / watch / risk + series colors.
      // Kept separate so the brand accent is never confused with
      // "good vs. bad". Consumed as Tailwind classes (bg-ink, text-good,
      // border-line, ...) instead of hardcoded hex scattered everywhere.
      // ============================================================
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // --- Track 1: brand + structure ---
              ink:   '#0B1F3B',          // navy — primary ink / brand
              'ink-2': '#334155',        // slate — secondary text
              muted: '#6B7280',          // tertiary / muted text
              gold:  '#B8912E',          // accent for TEXT (AA on paper)
              'gold-bright': '#D4AF37',  // accent for fills / strokes only
              paper:   '#F5F3ED',        // page canvas (warm)
              'paper-2': '#EFEBE0',      // recessed panels / toggle tracks
              card:  '#FDFCF9',          // card surface (warm near-white)
              line:  '#DED8C9',          // hairline border (warm)
              'line-2': '#E9E4D6',       // lighter divider

              // --- Track 2: semantic / data-encoding ---
              good:  '#15803D',          // healthy
              watch: '#B45309',          // caution
              risk:  '#B91C1C',          // critical
              'series-blue': '#2563EB',
              'series-violet': '#7C3AED',
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              serif: ['Newsreader', 'Georgia', 'serif'],
            },
            transitionTimingFunction: {
              spring: 'cubic-bezier(.32,.72,0,1)',
            },
            keyframes: {
              shimmer: { '100%': { backgroundPosition: '-200% 0' } },
              'fade-up': {
                '0%': { opacity: '0', transform: 'translateY(8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            animation: {
              shimmer: 'shimmer 1.4s ease-in-out infinite',
              'fade-up': 'fade-up .5s cubic-bezier(.32,.72,0,1) both',
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F5F3ED; /* Paper canvas (warm) */
        color: #0B1F3B; /* Navy */
      }
      /* Respect reduced-motion at the top level */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F5F3ED;
      }
      ::-webkit-scrollbar-thumb {
        background: #DED8C9;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D4AF37;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
